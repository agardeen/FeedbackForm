name = "field-feedback-card-scan"
main = "src/index.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# Non-secret config — safe to keep in source control. Change the model here
# any time without touching code (e.g. to move to a different provider's
# equivalent, once index.js is adapted for that provider's request shape).
[vars]
OPENAI_MODEL = "gpt-4o-mini"
ALLOWED_ORIGINS = "https://ff.altimate.app,http://localhost:8791"

# D1 database for synced records (feedback, survey, contacts, quick captures,
# meeting notes, todos) — see schema.sql. Bound as env.SYNC_DB.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "field-feedback-sync"
database_id = "3335e28b-ca20-49c4-aedc-79bffc43882f"

# R2 bucket for synced binary media (photos, audio, scans). Bound as env.SYNC_MEDIA.
[[r2_buckets]]
binding = "SYNC_MEDIA"
bucket_name = "field-feedback-media"

# Secrets (never put these here) — set once via:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put APP_SHARED_KEY     (optional abuse deterrent for the card-scan route only; see README)
#   wrangler secret put ADMIN_KEY          (required to create accounts; never ships in client code; see migrations/README.md)
#   wrangler secret put AUTH_JWT_SECRET    (required for login/session tokens; see migrations/README.md)
